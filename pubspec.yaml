
name: faraz_ahmad_portfolio
description: A modern responsive Flutter Developer Portfolio with Firebase Admin Dashboard.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # Navigation
  go_router: ^15.1.2

  # UI & Fonts
  google_fonts: ^6.2.1

  # Image Loading
  cached_network_image: ^3.4.1

  # External URLs
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/images/projects/
